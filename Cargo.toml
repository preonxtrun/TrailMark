[workspace]
resolver = "2"
members = ["crates/trailmark-core", "crates/trailmark-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tree-sitter = "0.25.10"
tree-sitter-python = "0.23.6"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-go = "0.23.4"
tree-sitter-rust = "0.23.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
regex = "1.11"
ignore = "0.4"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
