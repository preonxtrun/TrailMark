[project]
name = "trailmark"
version = "0.1.0"
description = "Hidden optimization layer between coding CLIs and the codebase: graph-ranked atlas, preflight planning, test graph, flight rules. Pure files, zero CLI modification."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.5",
]

[project.optional-dependencies]
bench = ["swebench>=3.0", "datasets>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
trailmark = "trailmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
